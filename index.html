    <script>
      // Apply the persisted colour scheme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('northi-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage may be blocked — fall back to light mode */
        }
      })();
    </script>
